# Static site — no build step. Netlify serves /public as-is.
[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self)"
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"

# Always fetch the latest app code so fixes reach every desk on reload.
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"
